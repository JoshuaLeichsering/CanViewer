name: Feature request
description: Suggest something CanViewer should do, or do differently.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. [BACKLOG.md](https://github.com/JoshuaLeichsering/CanViewer/blob/main/BACKLOG.md)
        lists what is already planned; please look there first.
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task you are trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Sketches and examples from other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Formats and files
      description: If it concerns a file format or a kind of database (CAN FD, J1939, multiplexing, …), say which, and attach a small sample if you can.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: CanViewer keeps every file on the user's machine and makes no request to another host.
      options:
        - label: My idea works without sending data anywhere or loading anything from another host.
