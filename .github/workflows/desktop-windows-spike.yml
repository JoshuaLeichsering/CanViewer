# Spike: can CI build CanViewer as a Tauri desktop app on Windows, install it,
# and use it, ARXML import through Pyodide included?
# See docs/spikes/2026-11-01-tauri-windows/README.md.
name: Desktop spike (Tauri, Windows)

on:
  push:
    branches: [claude/elegant-ptolemy-w4idkj-tauri-windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Corpus submodule for the ARXML smoke file
        run: git submodule update --init --depth 1 third_party/canmatrix

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache the Pyodide wheels
        uses: actions/cache@v4
        with:
          path: vendor/pyodide
          key: pyodide-wheels-${{ hashFiles('src/lib/canmatrix/wheels.lock.json') }}

      - run: npm run fetch-wheels

      - name: Build the web app
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri environment
        run: npx tauri info

      - name: Build the installers (MSI and NSIS)
        # The web build above is what gets embedded; don't build it twice.
        shell: bash
        run: npx tauri build --ci --bundles msi,nsis --config '{"build":{"beforeBuildCommand":""}}'

      - name: Package sizes
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi) +
                   @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) +
                   @(Get-Item src-tauri/target/release/canviewer.exe)
          $rows = $files | ForEach-Object { "| $($_.Name) | $($_.Length) | $([math]::Round($_.Length / 1MB, 1)) MB |" }
          $table = @('| File | Bytes | Size |', '|---|---|---|') + $rows
          $table | Out-Host
          $table | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: canviewer-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: WebView2 runtime on the runner
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          foreach ($k in $keys) { if (Test-Path $k) { "$k pv=$((Get-ItemProperty $k).pv)" } }
          [System.Environment]::OSVersion.VersionString

      - name: Install the MSI silently
        shell: pwsh
        run: |
          $msi = (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v msi-install.log" -Wait -PassThru
          "msiexec /i exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 60; exit $p.ExitCode }
          $exe = Get-ChildItem 'C:\Program Files' -Recurse -Depth 2 -Filter *.exe |
                 Where-Object { $_.Directory.Name -eq 'CanViewer' -and $_.Name -notlike 'uninstall*' } |
                 Select-Object -First 1
          if (-not $exe) { Get-Content msi-install.log -Tail 60; throw 'installed CanViewer executable not found' }
          "installed: $($exe.FullName) ($($exe.Length) bytes)"
          "CANVIEWER_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Smoke test the installed app (demo.dbc and an ARXML file)
        shell: pwsh
        env:
          # Playwright's documented way to drive a WebView2 app. wry's default
          # arguments are repeated in case this list replaces them.
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222 --disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection
        run: |
          npm install --no-save --no-package-lock --prefix "$env:RUNNER_TEMP\pw" playwright-core@1.63.0 | Out-Null
          $env:NODE_PATH = "$env:RUNNER_TEMP\pw\node_modules"
          $app = Start-Process $env:CANVIEWER_EXE -PassThru
          node docs/spikes/2026-11-01-tauri-windows/smoke.mjs --cdp http://127.0.0.1:9222 --out smoke `
            --dbc examples/demo.dbc --arxml third_party/canmatrix/tests/files/arxml/test.arxml
          $code = $LASTEXITCODE
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          exit $code

      - name: Uninstall
        if: always() && env.CANVIEWER_EXE != ''
        shell: pwsh
        run: |
          Get-Process canviewer -ErrorAction SilentlyContinue | Stop-Process -Force
          $msi = (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /l*v msi-uninstall.log" -Wait -PassThru
          "msiexec /x exit code: $($p.ExitCode)"
          "executable still present: $(Test-Path $env:CANVIEWER_EXE)"
          if ($p.ExitCode -ne 0 -or (Test-Path $env:CANVIEWER_EXE)) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-evidence
          path: |
            smoke/
            msi-install.log
            msi-uninstall.log
          if-no-files-found: ignore
