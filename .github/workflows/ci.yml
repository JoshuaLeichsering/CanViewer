# CI for every push and pull request: typecheck, all tests with the corpus
# suites (which must run, never skip) and the coverage thresholds of
# vite.config.ts, the production build, the network check that proves the
# build makes no request outside its own origin, and the end-to-end flows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck, tests, build, network check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache the Pyodide wheels
        uses: actions/cache@v4
        with:
          path: vendor/pyodide
          key: pyodide-wheels-${{ hashFiles('app/src/lib/canmatrix/wheels.lock.json') }}

      - name: Fetch and verify the Pyodide wheels
        run: npm run fetch-wheels

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (verbose) with coverage and its thresholds
        run: npx vitest run --coverage --reporter=verbose --reporter=json --outputFile.json=test-report.json

      - name: Every corpus suite ran in full, nothing skipped
        run: node scripts/check-test-report.mjs test-report.json

      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          { echo '### Coverage'; echo; node scripts/coverage-summary.mjs; echo; echo 'Full report: the `coverage-report` artifact of this run.'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Production build
        run: npm run build

      # Playwright itself comes with npm ci (a pinned dev dependency); its
      # Chromium is downloaded here only, in CI.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Network check (no request outside the app's origin, works offline)
        env:
          PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: '1'
        run: |
          npx vite preview --port 4173 --strictPort > vite-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node e2e/network-check.mjs \
            http://localhost:4173/ network-check \
            third_party/canmatrix/tests/files/arxml/test.arxml \
            third_party/canmatrix/tests/files/arxml/ARXMLContainerTest.arxml \
            examples/demo.dbc dist

      - name: End-to-end flows (open, navigate, decode, theme, language, deep links, offline)
        env:
          # The network check's server still holds 4173.
          E2E_PORT: '4174'
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence
          path: |
            test-report.json
            network-check/
            vite-preview.log
            playwright-report/
            test-results/
          if-no-files-found: ignore

  licenses:
    # What the repository needs to be public: no identifying information in the
    # tree, a license header on every source file, only allowed licenses among
    # the npm packages, the wheels and the Rust crates, and third-party notices
    # that match what ships.
    name: licenses, notices, identifying information
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache the Pyodide wheels
        uses: actions/cache@v4
        with:
          path: vendor/pyodide
          key: pyodide-wheels-${{ hashFiles('app/src/lib/canmatrix/wheels.lock.json') }}

      - name: Fetch and verify the Pyodide wheels
        run: npm run fetch-wheels

      - name: No identifying information in the working tree
        run: node scripts/check-identifying-info.mjs

      - name: Tests of the scripts
        run: npm run test:scripts

      - name: SPDX headers, npm and wheel licenses
        run: npm run check:licenses

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Crate licenses
        run: cargo deny --manifest-path desktop/Cargo.toml check licenses

      - name: THIRD_PARTY_NOTICES.md matches what ships
        run: node scripts/third-party-notices.mjs --check
